<!doctype html>
<meta charset="utf-8">
<title>Micromachee</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="A tiny 8-bit fantasy console. 128x128, eight colours, one Lua file per game.">

<style>
  :root { --body: #101014; --ink: #e8e8ee; --dim: #8a8a99; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--body); color: var(--ink);
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 48px; min-height: 100vh;
    /* a game is not a scrolling document: no pinch-zoom, no rubber-band,
       no tap-highlight flash, no long-press callout on the buttons */
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  /* while a cart is running the page is the console — lock it to the viewport
     so the address bar and scroll cannot fight the controls */
  body.playing {
    padding: 8px; height: 100dvh; overflow: hidden;
    justify-content: center;
  }
  h1 { font-size: 20px; letter-spacing: 3px; margin: 0 0 2px; font-weight: 600; }
  .sub { color: var(--dim); margin-bottom: 22px; text-align: center; }
  a.by { text-decoration: none; }
  a.by:hover { color: var(--ink); }
  .hidden { display: none !important; }

  /* ── the shelf ───────────────────────────────────────────────────────── */
  #shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
           gap: 14px; width: 100%; max-width: 620px; }
  .cart { background: none; border: 1px solid #2a2a34; border-radius: 8px; padding: 8px;
          cursor: pointer; color: inherit; font: inherit; text-align: left; }
  .cart:hover { border-color: #4a4a5c; background: #16161c; }
  .cart canvas { width: 100%; image-rendering: pixelated; border-radius: 4px; display: block; }
  .cart .name { margin-top: 6px; font-weight: 600; }
  .cart .name { text-align: center; }

  /* ── the console ─────────────────────────────────────────────────────── */
  #deck { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #body { background: #1c1c24; border-radius: 14px; padding: 14px; }
  #bezel { background: #000; border-radius: 8px; padding: 6px; line-height: 0; }
  canvas#screen { image-rendering: pixelated; display: block; }

  #pad { display: flex; align-items: center; justify-content: space-between;
         width: 100%; margin-top: 12px; gap: 12px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 34px); gap: 3px; }
  .key { background: #33333f; color: #0d0d12; border: none; border-radius: 5px;
         font: 600 13px/1 ui-monospace, monospace; cursor: pointer; user-select: none;
         -webkit-user-select: none; touch-action: none; }
  .key.down { background: #ff004d; }
  .round { width: 44px; height: 44px; border-radius: 50%; font-size: 16px; }
  .roundwrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .roundwrap small { color: var(--dim); font-size: 11px; }
  .brand { color: #55556a; letter-spacing: 3px; font-size: 11px; text-align: center; }
  .brand small { display: block; letter-spacing: 1px; font-size: 9px; opacity: 0.75; }

  #meta { display: flex; justify-content: space-between; width: 100%;
          max-width: 420px; color: var(--dim); font-size: 13px; }
  #meta b { color: var(--ink); font-weight: 600; }
  #hint { color: var(--dim); font-size: 12px; text-align: center; }
  #info { position: absolute; inset: 0; background: rgba(0,0,0,.93);
          display: flex; flex-direction: column; justify-content: center;
          gap: 8px; padding: 18px; text-align: center; }
  #info h2 { margin: 0; font-size: 15px; letter-spacing: 2px; }
  #info p { margin: 0; color: var(--dim); font-size: 12px; line-height: 1.5; }
  #start { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
           background: rgba(0,0,0,.75); border: 1px solid #ff004d; border-radius: 20px;
           padding: 5px 14px; font-size: 12px; animation: blink 1.3s infinite; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
  #screenwrap { position: relative; }

  button.plain { background: none; border: 1px solid #2a2a34; color: var(--dim);
                 border-radius: 6px; padding: 5px 12px; cursor: pointer; font: inherit; }
  button.plain:hover { color: var(--ink); border-color: #4a4a5c; }
  #topbar { display: flex; gap: 8px; margin-bottom: 18px; }
  #err { color: #ff6a86; max-width: 520px; text-align: center; }

  /* Phones and other coarse-pointer devices: bigger thumbs, bigger targets,
     and a layout that fills the screen instead of a small centred card. */
  @media (pointer: coarse), (max-width: 640px) {
    body { padding: 12px; }
    #topbar { margin-bottom: 10px; }
    #body { padding: 10px; width: 100%; max-width: 460px; }
    #deck { gap: 8px; width: 100%; }
    #pad { margin-top: 10px; gap: 8px; }
    .dpad { grid-template-columns: repeat(3, 15vw); grid-template-rows: repeat(3, 15vw); }
    .dpad .key { max-width: 60px; max-height: 60px; }
    .key { font-size: 4vw; }
    .round { width: 17vw; height: 17vw; max-width: 68px; max-height: 68px; font-size: 5vw; }
    .roundwrap small { font-size: 3vw; }
    #shelf { grid-template-columns: repeat(auto-fill, minmax(28vw, 1fr)); gap: 10px; }
    #meta, #hint { font-size: 12px; }
    /* the keyboard hint is meaningless on a touch device */
    #hint.touch-hidden { display: none; }
  }
</style>

<h1>MICROMACHEE</h1>
<a class="sub by" href="https://pixygon.io">by Pixygon</a>

<div id="topbar">
  <button class="plain" id="theme">theme: micromachee</button>
  <button class="plain hidden" id="back">← shelf</button>
</div>

<div id="err"></div>
<div id="shelf"></div>

<div id="deck" class="hidden">
  <div id="body">
    <div id="screenwrap">
      <div id="bezel"><canvas id="screen" width="128" height="128"></canvas></div>
      <div id="info" class="hidden">
        <h2 id="infoTitle"></h2>
        <p id="infoAbout"></p>
        <p id="infoBy"></p>
        <p style="opacity:.6">O CLOSES · X PLAYS</p>
      </div>
      <div id="start" class="hidden">PRESS X TO START</div>
    </div>
    <div id="pad">
      <div class="dpad">
        <span></span><button class="key" data-bit="2">W</button><span></span>
        <button class="key" data-bit="0">A</button><span></span><button class="key" data-bit="1">D</button>
        <span></span><button class="key" data-bit="3">S</button><span></span>
      </div>
      <div class="brand">MICROMACHEE<small>by Pixygon</small></div>
      <div style="display:flex; gap:10px">
        <div class="roundwrap"><button class="key round" data-bit="4">O</button><small>Z</small></div>
        <div class="roundwrap"><button class="key round" data-bit="5">X</button><small>X</small></div>
      </div>
    </div>
  </div>
  <div id="meta"><span id="title"></span><span>SCORE <b id="score">0</b></span></div>
  <div id="hint">arrows or WASD · Z and X · Esc for the shelf</div>
</div>

<script src="./node_modules/wasmoon/dist/index.js"></script>
<script type="module">
import { loadCart, blit, localStore, THEMES, W, H } from "./micromachee.js";
import { Mega, megaCover, MEGA_ID, MEGA_TITLE, MEGA_ABOUT } from "./mega.js";
// One request for the whole shelf: the catalog carries each cart's source, and
// .json is the only thing the CDN sends CORS headers for anyway. The url is
// generated from the helper, so the page always asks for a shelf that exists.
import { CATALOG } from "./console-data.js";
import { Speaker } from "./sound.js";

const speaker = new Speaker();
const FPS = 30;

const $ = (id) => document.getElementById(id);
const factory = new window.wasmoon.LuaFactory("./node_modules/wasmoon/dist/glue.wasm");

let themeIds = Object.keys(THEMES);
let theme = themeIds[0];
let carts = [];
let running = null;      // the cart being played
let armed = null;        // chosen, waiting for X
let held = 0;
// Bits pressed since the last frame was handed to the cart. A tap that goes
// down and up between two frames would otherwise be sampled as "never pressed",
// and btnp() would never see it — which is most of a menu press.
let latch = 0;
let timer = null;

const palette = () => THEMES[theme];

// ── the shelf ──────────────────────────────────────────────────────────────
async function buildShelf() {
  let list;
  try {
    list = await (await fetch(CATALOG)).json();
  } catch (e) {
    $("err").textContent = "could not reach the shelf: " + e.message;
    return;
  }
  carts = [
    { id: MEGA_ID, title: MEGA_TITLE, about: MEGA_ABOUT, author: "pixygon", code: "" },
    ...(list.carts || []),
  ];
  $("shelf").innerHTML = "";
  for (const entry of carts) {
    const el = document.createElement("button");
    el.className = "cart";
    el.innerHTML = `<canvas width="${W}" height="${H}"></canvas><div class="name"></div>`;
    el.querySelector(".name").textContent = entry.title;
    el.onclick = () => choose(entry);
    $("shelf").appendChild(el);
    entry._canvas = el.querySelector("canvas");
    drawCover(entry);   // fetched and drawn per cart, so one slow one blocks nothing
  }
}

/// The cover is drawn by running the cart's own `_cover()` — the same thing the
/// console does, because it is the same console.
async function drawCover(entry) {
  if (entry.id === MEGA_ID) {
    blit(megaCover(), entry._canvas.getContext("2d"), palette(), 1);
    return;
  }
  try {
    const cart = await loadCart(factory, entry.code);
    cart.init();
    if (cart.hasCover()) cart.cover();
    else for (let i = 0; i < 45; i++) { cart.update(); cart.draw(); }
    blit(cart.screen, entry._canvas.getContext("2d"), palette(), 1);
    cart.close();
  } catch (e) {
    /* a cart that will not load simply has no picture */
  }
}

// ── playing ────────────────────────────────────────────────────────────────
async function choose(entry) {
  stop();
  $("err").textContent = "";
  $("shelf").classList.add("hidden");
  $("deck").classList.remove("hidden");
  $("back").classList.remove("hidden");
  document.body.classList.add("playing");
  fitScreen();
  $("title").textContent = entry.title;
  $("score").textContent = "0";
  fitScreen();

  if (entry.id === MEGA_ID) {
    // Nothing to load: its cover is drawn, and X builds the meta-game.
    const shot = megaCover();
    blit(shot, $("screen").getContext("2d"), palette(), 1);
    armed = { entry, cart: { close() {}, screen: shot } };
    showStart(entry);
    return;
  }
  const cart = await loadCart(factory, entry.code, {
    onSfx: (n) => speaker.play(n),
    onScore: (n) => ($("score").textContent = String(n)),
    storage: localStore(entry.id),
  });
  cart.init();
  if (cart.hasCover()) cart.cover();
  else cart.draw();
  paint(cart);
  armed = { entry, cart };
  showStart(entry);
}

/// The cover, the prompt, and the card behind O.
function showStart(entry) {
  $("infoTitle").textContent = entry.title;
  $("infoAbout").textContent = entry.about || "";
  $("infoBy").textContent = "by " + (entry.author || "pixygon");
  $("info").classList.add("hidden");
  $("start").classList.remove("hidden");
}

function toggleInfo() {
  if (!armed) return;
  const showing = !$("info").classList.contains("hidden");
  $("info").classList.toggle("hidden", showing);
  $("start").classList.toggle("hidden", !showing);
}

function start() {
  if (!armed) return;
  $("start").classList.add("hidden");
  $("info").classList.add("hidden");
  if (armed.entry.id === MEGA_ID) { startMega(); return; }
  // A fresh engine, so a cover drawn from `_init` never leaks into the game.
  const { entry } = armed;
  armed.cart.close();
  armed = null;
  // The X that started the game is not a move in it. Without this the press
  // carries into the first frame and the cart acts on it.
  held = 0;
  latch = 0;
  paintKeys();
  loadCart(factory, entry.code, {
    onSfx: (n) => speaker.play(n),
    onScore: (n) => ($("score").textContent = String(n)),
    // Per cart, in this browser: a farm planted today is still growing tomorrow.
    storage: localStore(entry.id),
  })
    .then((cart) => {
      running = cart;
      cart.init();
      timer = setInterval(() => {
        cart.setHeld(held | latch);
        latch = 0;
        try { cart.update(); cart.draw(); }
        catch (e) { $("err").textContent = String(e.message || e); stop(); return; }
        paint(cart);
      }, 1000 / FPS);
    });
}

/// The meta-game runs the same loop, except a round begins with an await, so
/// each tick is skipped rather than overlapped while one is loading.
function startMega() {
  const { entry } = armed;
  armed.cart.close();
  armed = null;
  held = 0; latch = 0; paintKeys();
  const mega = new Mega(factory, carts, (n) => speaker.play(n));
  running = { close() {}, screen: mega.out, mega };
  let busy = false;
  timer = setInterval(async () => {
    if (busy) return;
    busy = true;
    try {
      await mega.step(held | latch);
      latch = 0;
      $("score").textContent = String(mega.score);
      blit(mega.out, $("screen").getContext("2d"), palette(), 1);
    } catch (e) {
      $("err").textContent = String(e.message || e);
      stop();
    }
    busy = false;
  }, 1000 / FPS);
  void entry;
}

function stop() {
  if (timer) { clearInterval(timer); timer = null; }
  if (running) { running.close(); running = null; }
  if (armed) { armed.cart.close(); armed = null; }
  held = 0;
  paintKeys();
}

function toShelf() {
  stop();
  document.body.classList.remove("playing");
  $("info").classList.add("hidden");
  $("deck").classList.add("hidden");
  $("back").classList.add("hidden");
  $("shelf").classList.remove("hidden");
  $("start").classList.add("hidden");
}

function paint(cart) {
  blit(cart.screen, $("screen").getContext("2d"), palette(), 1);
}

/// One console pixel is a whole number of screen pixels, always: at a
/// fractional scale some pixels are wider than others and the screen shimmers.
function fitScreen() {
  // Fit to WIDTH and HEIGHT both: on a phone the controls and bars sit below
  // the screen, so budgeting only width makes a screen too tall to fit with its
  // own d-pad. The reserve is larger on a touch device, where the controls are.
  const coarse = window.matchMedia("(pointer: coarse)").matches
    || window.innerWidth <= 640;
  const reserve = coarse ? 260 : 150;
  const wRoom = Math.min(window.innerWidth - (coarse ? 28 : 80), 460);
  const hRoom = window.innerHeight - reserve;
  const scale = Math.max(1, Math.floor(Math.min(wRoom, hRoom) / W));
  const c = $("screen");
  c.style.width = W * scale + "px";
  c.style.height = H * scale + "px";
}

// ── buttons ────────────────────────────────────────────────────────────────
const KEYS = {
  ArrowLeft: 0, a: 0, A: 0, ArrowRight: 1, d: 1, D: 1,
  ArrowUp: 2, w: 2, W: 2, ArrowDown: 3, s: 3, S: 3,
  z: 4, Z: 4, " ": 4, x: 5, X: 5,
};

function paintKeys() {
  for (const el of document.querySelectorAll(".key")) {
    el.classList.toggle("down", (held & (1 << Number(el.dataset.bit))) !== 0);
  }
}

function setBit(bit, down) {
  const next = down ? held | (1 << bit) : held & ~(1 << bit);
  if (next === held) return;
  if (down) latch |= 1 << bit;
  held = next;
  paintKeys();
  // X plays; O is the other one — it shows what the game is.
  if (armed && down && bit === 5) start();
  else if (armed && down && bit === 4) toggleInfo();
}

addEventListener("keydown", (e) => {
  if (e.key === "Escape") { toShelf(); return; }
  const bit = KEYS[e.key];
  if (bit === undefined) return;
  e.preventDefault();
  setBit(bit, true);
});
addEventListener("keyup", (e) => {
  const bit = KEYS[e.key];
  if (bit !== undefined) { e.preventDefault(); setBit(bit, false); }
});

for (const el of document.querySelectorAll(".key")) {
  const bit = Number(el.dataset.bit);
  const down = (e) => { e.preventDefault(); setBit(bit, true); };
  const up = (e) => { e.preventDefault(); setBit(bit, false); };
  el.addEventListener("pointerdown", down);
  el.addEventListener("pointerup", up);
  el.addEventListener("pointerleave", up);
  el.addEventListener("pointercancel", up);
}

$("back").onclick = toShelf;
$("theme").onclick = () => {
  theme = themeIds[(themeIds.indexOf(theme) + 1) % themeIds.length];
  $("theme").textContent = "theme: " + theme;
  for (const entry of carts) if (entry._canvas) drawCover(entry);
  if (running) paint(running);
  else if (armed) paint(armed.cart);
};
addEventListener("resize", fitScreen);
addEventListener("orientationchange", () => setTimeout(fitScreen, 100));

// A game is not a document. Block the browser gestures that would otherwise
// zoom or select while thumbs are on the controls.
for (const ev of ["gesturestart", "gesturechange", "gestureend"]) {
  addEventListener(ev, (e) => e.preventDefault(), { passive: false });
}
let lastTouchEnd = 0;
addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouchEnd < 350) e.preventDefault();  // double-tap zoom
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener("contextmenu", (e) => {
  if (e.target.closest && e.target.closest(".key")) e.preventDefault();
});

// On a touch device the "arrows or WASD" hint is noise — the buttons are right
// there. Swap it for a touch-appropriate line.
if (window.matchMedia("(pointer: coarse)").matches) {
  const hint = document.getElementById("hint");
  if (hint) hint.textContent = "tap the pad and buttons · back for the shelf";
}

buildShelf();
</script>
