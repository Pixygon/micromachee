[package]
name = "omarchy-micromachee"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A tiny 8-bit fantasy console that lives in your bar. 128x128, 8 colours, one Lua file per game."
repository = "https://github.com/Pixygon/micromachee"

[dependencies]
serde_json = "1"

# A bar widget is running on someone's desktop all day. Keep it small.
[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
